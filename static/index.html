<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>VO2max</title>
<style>
  :root{--bg:#0b0f14;--card:#151d26;--line:#243040;--txt:#e9eff7;--dim:#8d9dae;--acc:#31d0aa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;
       padding:16px 14px 40px;max-width:520px;margin:0 auto}
  h1{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .big{font-size:34px;font-weight:700;line-height:1.1}
  .set{font-size:17px;font-weight:650;line-height:1.4}
  .hr{display:flex;gap:10px;margin-top:12px}
  .pill{flex:1;background:#0f151c;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .pill b{display:block;font-size:16px}
  .pill span{font-size:11px;color:var(--dim)}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--acc);color:#04211b;
         font:inherit;font-weight:700;margin-top:10px}
  input,label.file{display:block;width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
        background:#0f151c;color:var(--txt);font:inherit;margin-bottom:8px}
  label.file{text-align:center;border-style:dashed;color:var(--dim);font-size:13px}
  input[type=file]{display:none}
  ul{list-style:none;padding:0;margin:0;font-size:13px;color:var(--dim)}
  li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .hidden{display:none}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
</style>
</head>
<body>
<h1>VO2max</h1>

<div id="login" class="card hidden">
  <div class="label">Login</div>
  <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password">
  <button id="btnLogin">Masuk</button>
</div>

<div id="app" class="hidden">
  <div class="card">
    <div class="label">Sesi minggu ini</div>
    <div class="set" id="setText">—</div>
    <div class="hr">
      <div class="pill"><b id="hrRange">—</b><span>HR target</span></div>
      <div class="pill"><b id="paceText">—</b><span>Pace</span></div>
    </div>
    <button id="btnCheck">Cek hasil sesi</button>
  </div>

  <div class="card">
    <div class="label">VDOT</div>
    <div class="big" id="vdot">—</div>
    <div class="label" style="margin-top:12px">Run terakhir</div>
    <ul id="recent"></ul>
  </div>

  <div class="card">
    <div class="label">Import run</div>
    <label class="file">Pilih file TCX / FIT
      <input id="file" type="file" accept=".tcx,.fit">
    </label>
    <button id="btnImport">Import folder di server</button>
  </div>

  <div class="card">
    <div class="label">Input manual (dari Mi Fitness)</div>
    <div class="row">
      <input id="mDate" type="date">
      <input id="mKm" type="number" step="0.01" placeholder="km">
    </div>
    <div class="row">
      <input id="mTime" type="text" placeholder="mm:ss">
      <input id="mHr" type="number" placeholder="avg HR">
    </div>
    <button id="btnManual">Simpan</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
